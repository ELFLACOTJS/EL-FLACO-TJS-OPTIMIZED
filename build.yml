name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python no ambiente de compilação
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Compilar aplicativo Windows
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name "EL_FLACO_TJS_OPTIMIZED" app.py

      - name: Publicar EXE para download
        uses: actions/upload-artifact@v4
        with:
          name: EL-FLACO-TJS-OPTIMIZED-Windows
          path: dist/EL_FLACO_TJS_OPTIMIZED.exe
          if-no-files-found: error
